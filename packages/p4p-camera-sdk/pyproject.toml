[project]
name = "p4p-camera-sdk"
version = "0.1.0"
description = "P4P relay/KCP and Ucon SD-card protocol primitives"
requires-python = ">=3.12"
dependencies = [
    "kcp>=0.1.0",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
