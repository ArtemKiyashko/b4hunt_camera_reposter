name: camera-reposter

x-service-defaults: &service-defaults
  image: ${IMAGE_REPOSITORY:-ghcr.io/artemkiyashko/b4hunt-camera-reposter}:${IMAGE_TAG:-latest}
  env_file: .env
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - app-data:/data
    - media:/media
  restart: unless-stopped
  init: true

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  camera-poller:
    <<: *service-defaults
    command: python -m camera_reposter.services.poller
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

  media-downloader:
    <<: *service-defaults
    command: python -m camera_reposter.services.downloader
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-publisher:
    <<: *service-defaults
    command: python -m camera_reposter.services.publisher
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  media:
  redis-data:
