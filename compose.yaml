name: camera-reposter

x-service-defaults: &service-defaults
  image: ghcr.io/artemkiyashko/b4hunt-camera-reposter:latest
  environment:
    REDIS_URL: redis://redis:6379/0
    DATABASE_PATH: /data/state.db
    MEDIA_ROOT: /media
    CAMERA_POLL_INTERVAL_SECONDS: ${CAMERA_POLL_INTERVAL_SECONDS:-60}
    AI_REQUIRED: ${AI_REQUIRED:-false}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    UBIA_ACCOUNT: ${UBIA_ACCOUNT:-}
    UBIA_ACCOUNT_PASSWORD: ${UBIA_ACCOUNT_PASSWORD:-}
    UBIA_DEVICE_INDEX: ${UBIA_DEVICE_INDEX:-0}
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - app-data:/data
    - media:/media
  restart: unless-stopped
  init: true

services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped

  camera-poller:
    <<: *service-defaults
    command: python -m camera_reposter.services.poller
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

  media-downloader:
    <<: *service-defaults
    command: python -m camera_reposter.services.downloader
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

  telegram-publisher:
    <<: *service-defaults
    command: python -m camera_reposter.services.publisher
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import os; raise SystemExit(0 if os.path.exists(\"/data/state.db\") else 1)' "]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
  media:
  redis-data:
