[project]
name = "camera-reposter"
version = "0.1.0"
description = "Asynchronous camera media delivery pipeline for Telegram"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "p4p-camera-sdk==0.1.15",
    "redis>=5.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
